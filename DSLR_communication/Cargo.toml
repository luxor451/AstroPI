[package]
name = "camera_control"
version = "0.1.0"
edition = "2021"
description = "Camera control library using gphoto2"

[lib]
name = "camera_control"
path = "src/lib.rs"

[[bin]]
name = "camera_control"
path = "src/main.rs"

[dependencies]
gphoto2 = "3.4"
tokio = { version = "1.0", features = ["rt", "time", "macros"] }