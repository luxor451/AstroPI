[package]
name = "AstroPI"
version = "0.1.0"
edition = "2021"

[dependencies]
astro_pi_plate_solving = { path = "AstroPI_PlateSolving" }
camera_control = { path = "DSLR_communication" }
eqmod_communication = { path = "eqmod_communication" }

env_logger = "0.11"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.49.0"
actix-cors = "0.7.0"
actix-web = "4"
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures = "0.3.32"
