[package]
name = "rusty_guider_web"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Server & Async Runtime
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Serialization (JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image Processing
image = "0.24"
base64 = "0.21"

# Optimization
argmin = "0.10"
argmin-math = { version = "0.4", features = ["vec"] }
rand = "0.9.2"
nalgebra = "0.33"
